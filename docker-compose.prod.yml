version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_activos
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - backend-activos
    networks:
      - activos_network

  backend-activos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_activos_prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - activos_network

  mysql:
    image: mysql:8.0
    container_name: mysql_activos_prod
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: America/La_Paz
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SecretPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-activos_fijos}
      MYSQL_USER: ${MYSQL_USER:-comibol_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ComibolDbPass2026!}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SecretPassword2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - activos_network

networks:
  activos_network:
    driver: bridge

volumes:
  mysql_prod_data:
